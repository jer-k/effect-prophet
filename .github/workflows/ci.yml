name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: npm

      - name: Install pinned npm version
        run: npm install --global "$(node --print 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: npm ci

      - name: Install pinned wasm-pack version
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  rust:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".tool-versions"

      - name: Install pinned wasm-pack version
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Check formatting
        run: npm run format:rust:check

      - name: Lint
        run: npm run lint:rust

      - name: Test
        run: npm run test:rust

      - name: Test Node/WASM integration
        run: npm run test:wasm
