name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04

    # Publishes with npm trusted publishing (OIDC), so no npm token is stored. Configure the
    # trusted publisher on npmjs.com for this repository and the `release.yml` workflow.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install pinned npm version
        run: npm install --global "$(node --print 'require("./package.json").packageManager')"

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node --print 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install pinned wasm-pack version
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build and test package artifact
        run: npm run test:package

      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi
