name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: npm

      - name: Install pinned npm version
        run: npm install --global "$(node --print 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: npm ci

      - name: Install pinned wasm-pack version
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Type check examples
        run: npm run docs:typecheck

      - name: Run examples
        run: npm run docs:examples

  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: npm

      - name: Install pinned npm version
        run: npm install --global "$(node --print 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run docs:build

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [examples, build]
    runs-on: ubuntu-22.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
