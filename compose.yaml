name: effect-prophet-comparison

x-prophet-reference: &prophet-reference
  build:
    context: .
    dockerfile: tools/prophet/Dockerfile
  image: effect-prophet/reference-fixtures:1.4.0
  platform: linux/amd64
  network_mode: none
  read_only: true
  tmpfs:
    - /tmp

services:
  prophet-calendars-generate:
    <<: *prophet-reference
    profiles: [calendars-generate]
    entrypoint: [/opt/effect-prophet-reference/bin/python, tools/prophet/generate_calendars.py]
    command: [generate, --output, /artifacts]
    environment:
      PYTHONHASHSEED: "0"
    volumes:
      - ./calendars:/artifacts/calendars
      - ./third-party/calendars:/artifacts/third-party/calendars
      - ./src/internal/country-holiday-catalog.ts:/artifacts/src/internal/country-holiday-catalog.ts

  prophet-calendars-check:
    <<: *prophet-reference
    profiles: [calendars-check]
    entrypoint: [/opt/effect-prophet-reference/bin/python, tools/prophet/generate_calendars.py]
    command: [check, --output, /artifacts]
    environment:
      PYTHONHASHSEED: "1"
    volumes:
      - ./calendars:/artifacts/calendars:ro
      - ./third-party/calendars:/artifacts/third-party/calendars:ro
      - ./src/internal/country-holiday-catalog.ts:/artifacts/src/internal/country-holiday-catalog.ts:ro

  prophet-fixtures-generate:
    <<: *prophet-reference
    profiles: [fixtures-generate]
    command: [generate, --output, /fixtures]
    volumes:
      - ./integration/fixtures/prophet-1.4.0:/fixtures

  prophet-fixtures-check:
    <<: *prophet-reference
    profiles: [fixtures-check]
    command: [check, --output, /fixtures]
    volumes:
      - ./integration/fixtures/prophet-1.4.0:/fixtures:ro

  effect-prophet-fixtures:
    build:
      context: .
      dockerfile: tools/docker/effect-prophet.Dockerfile
    image: effect-prophet/fixture-tests:local
    platform: linux/amd64
    profiles: [fixtures-check]
    depends_on:
      prophet-fixtures-check:
        condition: service_completed_successfully
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Vitest 5 writes an API token under the user data dir, which is read-only here.
      XDG_DATA_HOME: /tmp/xdg-data
    volumes:
      - ./integration/fixtures/prophet-1.4.0:/workspace/integration/fixtures/prophet-1.4.0:ro
